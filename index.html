<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>农场优先生 · 现挖蜜薯</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;background:#fff8f0;color:#3a2a1a}
header{background:linear-gradient(135deg,#c2410c,#f59e0b);color:#fff;padding:64px 24px;text-align:center}
header h1{font-size:40px;margin-bottom:12px}header p{font-size:18px;opacity:.9}
.btn{display:inline-block;margin-top:24px;background:#fff;color:#c2410c;padding:12px 28px;border-radius:999px;font-weight:700;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:48px 24px}h2{font-size:26px;margin-bottom:24px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 16px rgba(194,65,12,.1)}
.emoji{font-size:48px}.card h3{margin:12px 0 8px}.price{color:#c2410c;font-size:24px;font-weight:700;margin-top:12px}
.feat{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:8px}.feat div{background:#fde68a;padding:10px 18px;border-radius:999px}
footer{text-align:center;padding:32px;color:#8a6a4a;font-size:14px}
</style></head><body>
<header><h1>🍠 农场优先生</h1><p>产地现挖，香甜软糯，从地头直接到你家</p><a class="btn" href="#products">看看蜜薯</a></header>
<div class="wrap"><div class="feat"><div>🌱 自家种植</div><div>🚚 产地直发</div><div>📦 5斤装</div><div>💯 坏果包赔</div></div></div>
<div class="wrap" id="products"><h2>在售品种</h2><div class="grid">
<div class="card"><div class="emoji">🍠</div><h3>农家红蜜薯 5斤装</h3><p>红皮黄心，烤着吃流蜜，蒸着吃软糯。</p><div class="price">¥35.9</div></div>
<div class="card"><div class="emoji">🌰</div><h3>牛奶白皮板栗薯</h3><p>白皮黄心，口感粉糯，有板栗香。</p><div class="price">¥39.9</div></div>
<div class="card"><div class="emoji">🧺</div><h3>白皮黄心小蜜薯组合</h3><p>个头小巧，一次一个，刚好一顿。</p><div class="price">¥39.8</div></div>
</div></div>
<footer>示例页面 · 仅供预览效果</footer></body></html>
